name: build_and_test

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [
          {"python-version": "3.11", "pinned": true},
          {"python-version": "3.12", "pinned": true},
          {"python-version": "3.13", "pinned": true},
          {"python-version": "3.13", "pinned": false},
          {"python-version": "3.14", "pinned": true},
          {"python-version": "3.14", "pinned": false},
          # Python 3.15 is not released yet.  There is no point testing it
          # against the lockfile since the pinned versions predate it, so it is
          # tested against the newest libraries in both the standard and the
          # free-threaded build.
          {"python-version": "3.15", "pinned": false, "prerelease": true},
          {"python-version": "3.15t", "pinned": false, "prerelease": true},
        ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need to clone everything for the git tag tests.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
          python-version: ${{ matrix.variant.python-version }}
          enable-cache: true

      # Testing against the lockfile checks the PR against a known-good build.
      # One unpinned variant gives early warning of problems with the latest
      # releases of our dependencies.
      - name: Upgrade all dependencies in lockfile
        run: uv lock --upgrade
        if: matrix.variant.pinned == false

      - name: Build and install
        run: uv sync --locked

      - name: List installed packages
        run: uv tree

      - name: Run tests
        run: |
          uv run --locked pytest -r a -v --cov=tests --cov=lsst_versions --cov-report=xml --cov-report=term

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  pypi:

    runs-on: ubuntu-latest
    needs: [build_and_test]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need to clone everything to embed the version.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest-known"
          enable-cache: true

      - name: Build and create distribution
        run: uv build

      - name: Upload
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_UPLOADS }}
