[project]
name = "lsst-versions"
description = "Calculate package versions following LSST code conventions."
license = "BSD-3-Clause"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.11"
authors = [
    {name = "Rubin Observatory Data Management", email = "dm-admin@lists.lsst.org"},
]
keywords = ["lsst"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "setuptools >= 46.0",
    "GitPython >= 3.1",
    "packaging",
]
dynamic = ["version", "readme"]

[project.urls]
"Homepage" = "https://github.com/lsst/lsst_versions"
"Source code" = "https://github.com/lsst/lsst_versions"
"Issue tracker" = "https://github.com/lsst/lsst_versions/issues"

[project.optional-dependencies]
dev = [
    "pytest >= 3.2",
    "pytest-cov >= 5.0",
    "hatchling >= 1.27.0",
]
typing = [
    "mypy >= 1.14",
    "types-setuptools >= 75",
]

[project.scripts]
lsst-version = "lsst_versions._cmd:main"

[project.entry-points."setuptools.finalize_distribution_options"]
lsst_versions = "lsst_versions:infer_version_for_setuptools"

[project.entry-points.hatch]
lsst = "lsst_versions.hatch"

[build-system]
requires = [
    "setuptools >= 77.0",
    "GitPython",
    "packaging",
]
# This package can not use its own setuptools entry point to version itself
# because that entry point is only registered once the package is installed.
# The in-tree backend writes the version file before delegating to setuptools.
backend-path = ["python"]
build-backend = "lsst_versions._build_backend"

[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic]
# Written by the in-tree build backend before setuptools reads it.
version = {file = "VERSION"}
readme = {file = ["README.rst", "doc/lsst_versions/CHANGES.rst"], content-type = "text/x-rst"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
lsst_versions = ["py.typed"]

[tool.pydocstyle]
convention = "numpy"
add-ignore = "D100, D102, D105, D107, D200, D205, D400"

# An empty section is required to stop pytest searching parent directories
# for a configuration file that may not be compatible with this package.
[tool.pytest.ini_options]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "git.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lsst_versions.*"
ignore_missing_imports = false
ignore_errors = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
warn_unreachable = true
warn_unused_ignores = true

[tool.towncrier]
    package = "lsst_versions"
    package_dir = "python"
    filename = "doc/lsst_versions/CHANGES.rst"
    directory = "doc/changes"
    title_format = "lsst_versions {version} {project_date}"
    issue_format = "`{issue} <https://jira.lsstcorp.org/browse/{issue}>`_"

    [[tool.towncrier.type]]
        directory = "feature"
        name = "New Features"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "api"
        name = "API Changes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "bugfix"
        name = "Bug Fixes"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "perf"
        name = "Performance Enhancement"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "misc"
        name = "Miscellaneous Changes of Minor Interest"
        showcontent = true

    [[tool.towncrier.type]]
        directory = "removal"
        name = "An API Removal or Deprecation"
        showcontent = true

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [
    "__init__.py",
]

[tool.ruff.lint]
ignore = [
    "D107",
    "D105",
    "D102",
    "D104",
    "D100",
    "D200",
    "D205",
    "D400",
]
select = [
    "E",  # pycodestyle
    "F",  # pycodestyle
    "N",  # pep8-naming
    "W",  # pycodestyle
    "D",  # pydocstyle
    "I",  # isort
]

[tool.ruff.lint.isort]
known-first-party = ["lsst"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 69
